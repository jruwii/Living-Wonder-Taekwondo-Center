<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Wonder Taekwondo Center | Angeles City, Pampanga</title>
    <meta name="description" content="Learning is a living wonder! Premier martial arts academy in Angeles City, Philippines specializing in building belonging, confidence, and discipline for all ages." />
    <meta property="og:title" content="Living Wonder Taekwondo Center" />

    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#060c18" />

    <!--
      Set the theme class before anything is painted, otherwise the page would
      flash white for a moment before React loads and applies the saved theme.
      Keep the key and the "dark by default" rule in step with ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lw_tkd_theme');
          document.documentElement.classList.add(saved === 'light' ? 'light' : 'dark');
        } catch (error) {
          // Storage can be blocked in private mode; fall back to the dark default
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
