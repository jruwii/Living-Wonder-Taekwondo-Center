# Builds the site and publishes it to GitHub Pages.
#
# GitHub Pages cannot run Vite, so it cannot serve the files in src/ directly.
# This workflow compiles them into plain HTML, CSS and JavaScript first, then
# publishes the dist/ folder that comes out.

name: Deploy to GitHub Pages

on:
  # Publish whenever main changes
  push:
    branches: [main]
  # ...and allow a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If several pushes land at once, let the newest one win
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for type errors
        run: npm run lint

      - name: Build the site
        run: npm run build
        env:
          # The booking endpoint is baked in at build time. It comes from the
          # repository secret so the URL is not written into the source code.
          # Add it under Settings -> Secrets and variables -> Actions.
          VITE_BOOKING_ENDPOINT: ${{ secrets.VITE_BOOKING_ENDPOINT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
